# Autopost on the shared VPS (deploy/vps/README.md).
# Self-hosted Supabase is its own compose project in /opt/autopost/supabase (network
# autopost-supabase_default). The LMS Caddy owns ports 80/443 and forwards the Autopost domains
# to autopost-gateway over the LMS network (supabase_default); nothing here publishes a port.
name: autopost

services:
  # Plain-HTTP router behind the LMS Caddy: static site + Supabase API + Studio + n8n.
  # The only Autopost container on the LMS network; its name is unique there on purpose.
  autopost-gateway:
    image: caddy:2.11.1-alpine
    container_name: autopost-gateway
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      API_DOMAIN: ${API_DOMAIN:?}
      STUDIO_DOMAIN: ${STUDIO_DOMAIN:?}
      N8N_DOMAIN: ${N8N_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Static files only (copied by deploy.sh), never the repo itself (.git, .env…)
      - /opt/autopost/web:/srv/web:ro
    networks:
      - autopost
      - edge

  n8n:
    image: n8nio/n8n:2.44.6
    container_name: autopost-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: autopost-db
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?}
      # Encrypts saved credentials: losing it makes every credential unreadable (kept in .env and backups).
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?}
      N8N_HOST: ${N8N_DOMAIN:?}
      N8N_PROTOCOL: https
      N8N_PORT: '5678'
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      # LMS Caddy → autopost-gateway → n8n
      N8N_PROXY_HOPS: '2'
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '336'
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - autopost

networks:
  autopost:
    name: autopost-supabase_default
    external: true
  edge:
    name: supabase_default
    external: true

volumes:
  n8n-data:
